# =============================================================================
# Catchment 0121 - Chitral @ Chitral
# =============================================================================
# Multi-model run: HBV / HMETS / HYMOD × {baseline, glogem_har, glogem_tphipr,
# icemelt, subdaily} with ERA5-Land bulk precipitation correction. 10-yr
# cycled warm-up to equilibrate deep GW storage (each year used once).
#
# Daily-melt baselines (baseline, glogem_har, glogem_tphipr, icemelt) carry
# subdaily_method: null; only `subdaily` keeps the project-wide subdaily flag.
# =============================================================================

catchment: '0121'
display_name: 'Chitral @ Chitral'

start_date: '1980-01-01'
end_date: '1996-12-31'
cali_end_date: '1989-12-31'
warm_up_date: '1970-01-01'

# 10-yr warm-up cycled from the first 10 yrs of simulation data (1980-1989),
# each year used exactly once (no repetition) to equilibrate deep GW storage
# while preserving inter-annual variability. Matches 0102 pattern.
warmup:
  method: 'cycle'
  cycle_years: 10

# ERA5-Land bulk precipitation correction on; snow_corr tied to rain_corr
precip_correction: true

models:
  - HBV
  - HMETS
  - HYMOD

configurations:
  - baseline              # Daily, no glogem coupling — uncoupled baseline
  - glogem_har            # GloGEM-coupled, HAR forcing variant
  - glogem_tphipr         # GloGEM-coupled, ERA5 + TPHiPr precip override
  - icemelt               # Daily ice-melt option (no glogem coupling)
  - subdaily              # Subdaily HBV melt scheme (the explicit subdaily one)

calibration:
  metrics: [KGE]
  iterations: 3000
  ngs: 15

future:
  enabled: false
