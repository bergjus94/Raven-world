# =============================================================================
# Catchment 2268 — SPHY, Q+snow+baseflow calibration (full multi-objective)
# =============================================================================
# Sibling to catchment_2268_SPHY_Q_snow.yaml. Identical setup, adds an
# explicit winter-baseflow target on top of the elevation-band snow target.
#
# Tests whether the snow constraint alone already captures baseflow, or
# whether a separate baseflow objective (Huang et al. 2026 style) adds
# independent signal.
#
# `_calibration_metric: Q_snow_baseflow` routes outputs to
#   model_runs/catchment_2268/configs/glogem_subdaily_opt1/SPHY_Q_snow_baseflow/
# so this and the Q+snow variant don't collide on disk.
# =============================================================================

catchment: '2268'
display_name: 'Rhone @ Gletsch'
region: 'switzerland'

start_date: '2000-01-01'
end_date: '2020-12-31'
cali_end_date: '2010-12-31'
warm_up_date: '1990-01-01'

warmup:
  method: 'real'

precip_correction: true

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1

calibration:
  # See note in catchment_2268_SPHY_Q_snow.yaml — `metrics:` is the
  # routing/labelling list. 'Q_snow_baseflow' sends outputs to
  # SPHY_Q_snow_baseflow/ subdir.
  metrics: ['Q_snow_baseflow']
  iterations: 3000
  ngs: 15

  # Full multi-objective: Q + snow + winter baseflow.
  # Weights: Q slightly dominant, snow and baseflow equally constrained.
  # Reflects the paper's focus on baseflow physics — baseflow gets equal
  # weight to snow rather than the legacy "primary + secondary" hierarchy.
  objectives: [Q, snow, baseflow]
  weights:
    Q:        0.4
    snow:     0.3
    baseflow: 0.3
  Q:
    metric: KGE
  snow:
    metric: RMSE
    aggregation: elevation_band
    band_width_m: 100
    min_pixels_per_band: 5
    band_aggregation: area_weighted_mean
    cloud_threshold: 0.5
  baseflow:
    metric: KGE
    method: eckhardt           # standard digital filter (Eckhardt 2005)
    window: winter             # 'winter' preset = Nov-Mar. Alternatives:
                               #   'raw_winter' (Dec-Mar, tighter)
                               #   'all' (12 months — drops the seasonal gate)
                               #   [12, 1, 2] (any explicit month list)
                               # Nov-Mar is the standard for Swiss alpine
                               # — keeps melt-water out of the baseflow
                               # signal (Stahl 2008, Klaus & McDonnell 2013).

future:
  enabled: false
