# =============================================================================
# Catchment 2268 — Rhone @ Gletsch — test of warmup.method='real'
# =============================================================================
# Same catchment and period as catchment_2268_smoke.yaml but exercises the
# 'real' warm-up mode: MeteoSwiss/CAMELS-CH/GloGEM all cover 1981+ so real
# pre-simulation data is available for 1981-1990.
# =============================================================================

catchment: '2268'
display_name: 'Rhone @ Gletsch (real warmup)'
region: 'switzerland'

start_date: '1991-01-01'
end_date: '2005-12-31'
cali_end_date: '2000-12-31'
warm_up_date: '1981-01-01'

# Override the Swiss region default (cycle, cycle_years=10) to use real data
warmup:
  method: 'real'

models:
  - HBV

configurations:
  - subdaily

calibration:
  metrics: [KGE]
  iterations: 10
  ngs: 5

future:
  enabled: false
