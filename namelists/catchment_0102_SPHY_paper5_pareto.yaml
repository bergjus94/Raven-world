# =============================================================================
# Paper 5 — Hunza @ Dainyor (0102) — NSGAII Pareto on all 6 structures
# =============================================================================
# First production multi-structure calibration for Paper 5. Runs the full
# structure × glacier-GW factorial (S1-S6 in paper_5_methodology.md §4) on the
# largest UIB monsoon-influenced catchment, generating Pareto fronts that:
#   (a) give per-objective min/max ranges for UIB-region rescaling
#   (b) become the Hunza data point in the Phase 1 structure × catchment matrix
#   (c) serve as direct comparison to Huang et al. 2026 WRR (Pamir SPHY,
#       Gunt basin ~14000 km², similar climate regime)
#
# Calibration objectives:
#   - Q       : KGE on daily streamflow
#   - snow    : 1 - RMSE on per-elevation-band MODIS fSCA (Finger 2015 style)
#   - baseflow: KGE on RAW Dec-Mar Q (raw_winter, no Eckhardt filter applied)
#     Rationale: Hunza deep winter (Dec-Mar) is reliably below freezing across
#     the catchment, so observed winter Q is essentially pure baseflow without
#     needing a separation algorithm. Matches Huang 2026's "WBR" approach.
#
# Algorithm: NSGAII (multi-objective Pareto), production budget
#   10000 iter × 50 pop = 200 generations, ~30-33h wall clock per structure
#   running 6 in parallel.
# =============================================================================

catchment: '0102'
display_name: 'Hunza @ Dainyor'

start_date: '1980-01-01'
end_date: '2014-12-31'
cali_end_date: '1999-12-31'
warm_up_date: '1970-01-01'

# 10-yr warm-up cycled from the first 10 yrs of simulation data (1980-1989).
warmup:
  method: 'cycle'
  cycle_years: 10

precip_correction: true

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1                              # S1 — baseline (HBV-linear, no glacier-GW)
  - glogem_subdaily_opt1_glaciergw                    # S2 — + glacier-GW connectivity
  - glogem_subdaily_opt1_threshold                    # S3 — + HBV-Light Q0 threshold
  - glogem_subdaily_opt1_threshold_glaciergw          # S4 — threshold + glacier-GW
  - glogem_subdaily_opt2_sphy_faithful                # S5 — SPHY-faithful architecture
  - glogem_subdaily_opt2_sphy_faithful_glaciergw      # S6 — SPHY-faithful + glacier-GW

calibration:
  metrics: ['paper5_pareto']

  algorithm: NSGAII
  iterations: 10000
  n_pop: 50

  objectives: [Q, snow, baseflow]
  Q:
    metric: KGE
  snow:
    metric: RMSE
    aggregation: elevation_band
    band_width_m: 100
    min_pixels_per_band: 5
    band_aggregation: area_weighted_mean
    cloud_threshold: 0.5
  baseflow:
    metric: KGE
    method: raw_winter        # No filter; raw winter Q = baseflow (Huang 2026 style)
    window: winter            # auto-tightens to Dec-Mar when method=raw_winter

future:
  enabled: false
