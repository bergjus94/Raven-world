# =============================================================================
# Paper 5 — Hunza @ Dainyor (0102) — NSGAII Pareto on all 6 structures
# =============================================================================
# UIB monsoon-influenced catchment (~14000 km²). Direct comparison point for
# Huang et al. 2026 WRR (Pamir SPHY, Gunt basin, similar climate regime).
#
# Methodology (paper_5_methodology.md):
#   §4    — six subsurface structures S1-S6 (3×2 factorial: HBV-linear /
#           HBV-threshold / SPHY-faithful × {no glacier-GW, glacier-GW})
#   §12.4 — snow metric: nRMSE (bounded, KGE-shaped scale)
#   §12.6 — baseflow window: deep_winter (Dec-Jan-Feb)
#   §12.7 — baseflow filter: raw_winter (Q ≈ baseflow in DJF for cold
#           catchments; filter-comparison validation supports this)
#   §12.8 — metrics: KGE_NP (Pool 2018) for Q + baseflow; nRMSE for snow
#
# Budget: NSGAII 10000 iter × 50 pop = 200 generations.
# =============================================================================

catchment: '0102'
display_name: 'Hunza @ Dainyor'

start_date: '1980-01-01'
end_date: '2014-12-31'
cali_end_date: '1999-12-31'
warm_up_date: '1970-01-01'

# 10-yr warm-up cycled from the first 10 yrs of simulation data (1980-1989),
# equilibrates deep GW storage while preserving inter-annual variability.
warmup:
  method: 'cycle'
  cycle_years: 10

# ── Forcing (paper-5 Phase 1) ────────────────────────────────────────────
# Temperature: ERA5-Land (default meteo_source).
# Precipitation: TPHiPr (Yang et al. 2023) — ML-bias-corrected ERA5 over HMA;
# the published bias-correction for ERA5's high-elevation underestimation in
# the Tibetan Plateau / surrounding ranges. Matches Huang et al. 2026 Pamir
# SPHY setup directly.
precip_source: 'TPHiPr'
lapse_rate_precip_source: 'TPHiPr'

# In-model precip multiplier (Cx) is OFF — bias correction is done in the
# input data (TPHiPr) rather than as a free calibration parameter. Avoids
# the well-known Cx × melt-factor identifiability issue and keeps the
# structural comparison uncontaminated by forcing tuning.
precip_correction: false

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1                              # S1 — baseline (HBV-linear, no glacier-GW)
  - glogem_subdaily_opt1_glaciergw                    # S2 — + glacier→SLOW
  - glogem_subdaily_opt1_threshold                    # S3 — + HBV-Light Q0 threshold
  - glogem_subdaily_opt1_threshold_glaciergw          # S4 — threshold + glacier→SLOW
  - glogem_subdaily_opt2_sphy_faithful                # S5 — SPHY-faithful architecture
  - glogem_subdaily_opt2_sphy_faithful_glaciergw      # S6 — SPHY-faithful + glacier→SLOW
  - glogem_subdaily_opt1_glaciergw_fast               # S7 — S2 mirror, glacier→FAST
  - glogem_subdaily_opt1_threshold_glaciergw_fast     # S8 — S4 mirror, glacier→FAST
  - glogem_subdaily_opt2_sphy_faithful_glaciergw_fast # S9 — S6 mirror, glacier→FAST

calibration:
  metrics: ['paper5_pareto']

  algorithm: NSGAII
  iterations: 10000
  n_pop: 50

  objectives: [Q, snow, baseflow]
  Q:
    metric: KGE_NP
  snow:
    metric: nRMSE
    aggregation: elevation_band
    band_width_m: 100
    min_pixels_per_band: 5
    band_aggregation: area_weighted_mean
    cloud_threshold: 0.5
  baseflow:
    metric: KGE_NP
    method: raw_winter
    window: deep_winter        # DJF, 3 months — paper-5 Phase 1 standard

future:
  enabled: false
