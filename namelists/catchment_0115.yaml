# =============================================================================
# Catchment 0115 - Shyok @ Yugo
# =============================================================================
# Server production run: 6 glogem-coupled configurations × 2 metrics
# with ERA5-Land bulk precipitation correction. 10-yr cycled warm-up to
# equilibrate deep GW storage (each year used once, no repetition).
# =============================================================================

catchment: '0115'
display_name: 'Shyok @ Yugo'

start_date: '1980-01-01'
end_date: '1997-12-31'
cali_end_date: '1989-12-31'
warm_up_date: '1970-01-01'

# 10-yr warm-up cycled from the first 10 yrs of simulation data (1980-1989),
# each year used exactly once. Short-record catchment (18 yr total), so the
# cycle block coincides with the calibration period — harmless since warm-up
# outputs are not compared against observations.
warmup:
  method: 'cycle'
  cycle_years: 10

# ERA5-Land bulk precipitation correction on; snow_corr tied to rain_corr
precip_correction: true

models:
  - HBV

configurations:
  - glogem                # Daily melt baseline (vs S1 subdaily)
  - glogem_subdaily       # S1: 3-layer standard HBV (baseline)
  - gw_1_layer_glogem     # S0: single reservoir, no fast/slow split
  - gw_3_layer_glogem     # S2: fast + slow + deep GW
  - glacier_soil_glogem   # S3: MASKED_GLACIER gets soil profile, meltwater infiltrates
  - glacier_gw_glogem     # S5: SPHY-style split PONDED -> GlacROF*SW + (1-GlacROF)*SLOW
  - glogem_gmb            # External glacier mass balance forcing (path auto-swaps to .../GMB)
  # --- Exploratory sweep (untested variants) ---
  - baseline              # Uncoupled HBV, ERA5 forcing (internal glacier model)
  - subdaily              # Uncoupled HBV, ERA5, subdaily melt
  - icemelt               # Uncoupled HBV with HBV_EC icemelt on glacier HRUs
  - glogem_oudin          # GloGEM-coupled, Oudin PET instead of Hamon
  - glogem_har            # GloGEM-coupled, HAR forcing instead of ERA5
  - glogem_tphipr         # GloGEM-coupled, T/P bias-corrected (tphipr) forcing
  - glogem_icimod         # GloGEM-coupled, ICIMOD forcing

calibration:
  metrics: [KGE]
  iterations: 3000
  ngs: 15

future:
  enabled: false
