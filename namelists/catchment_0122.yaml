# =============================================================================
# Catchment 0122 - Swat @ Kalam
# =============================================================================
# Server production run: 5 glogem-coupled subsurface structures × 2 metrics
# with ERA5-Land bulk precipitation correction. Only 6-yr record available
# (1980-1985), so warm-up cycle is limited to 6 years (cycle_years=10 would
# require year repetition). Interpret results with caution: short record
# means calibration may overfit and deep-GW equilibration is incomplete.
# =============================================================================

catchment: '0122'
display_name: 'Swat @ Kalam'

start_date: '1980-01-01'
end_date: '1985-12-31'
cali_end_date: '1983-12-31'
warm_up_date: '1974-01-01'

# 6-yr warm-up cycled from the full simulation period (1980-1985), each
# year used exactly once. Shorter than the 10-yr cycle used for other
# catchments because the record is only 6 yrs — keeping no-repetition
# invariant is preferred over a longer warm-up. Cycle block coincides
# with the full simulation period — harmless since warm-up outputs are
# not compared against observations.
warmup:
  method: 'cycle'
  cycle_years: 6

# ERA5-Land bulk precipitation correction on; snow_corr tied to rain_corr
precip_correction: true

models:
  - HBV

configurations:
  - glogem_subdaily       # S1: 3-layer standard HBV (baseline)
  - gw_1_layer_glogem     # S0: single reservoir, no fast/slow split
  - gw_3_layer_glogem     # S2: fast + slow + deep GW
  - glacier_soil_glogem   # S3: MASKED_GLACIER gets soil profile, meltwater infiltrates
  - glacier_gw_glogem     # S5: SPHY-style split PONDED -> GlacROF*SW + (1-GlacROF)*SLOW

calibration:
  metrics: [KGE, KGE_WB]
  iterations: 3000
  ngs: 15

future:
  enabled: false
