# =============================================================================
# Catchment 0122 - Swat @ Kalam
# =============================================================================
# Server production run: 5 glogem-coupled subsurface structures × 2 metrics
# with ERA5-Land bulk precipitation correction. 10-yr warm-up achieved by
# tiling the 6-yr sim block (1980-1985) ~1.67× — some year repetition is
# unavoidable because the record is too short for a 10-yr no-repeat tile.
# Interpret calibration results with caution: short record may overfit.
# =============================================================================

catchment: '0122'
display_name: 'Swat @ Kalam'

start_date: '1980-01-01'
end_date: '1985-12-31'
cali_end_date: '1983-12-31'
warm_up_date: '1970-01-01'

# 10-yr warm-up filled by tiling a 6-yr cycle block (1980-1985, the full
# simulation period) forward. Block repeats ~1.67× to cover the warm-up
# window — some year repetition is unavoidable given the short record.
# Cycle block coincides with the full simulation period — harmless since
# warm-up outputs are not compared against observations.
warmup:
  method: 'cycle'
  cycle_years: 6

# ERA5-Land bulk precipitation correction on; snow_corr tied to rain_corr
precip_correction: true

models:
  - HBV

configurations:
  - glogem_subdaily       # S1: 3-layer standard HBV (baseline)
  - gw_1_layer_glogem     # S0: single reservoir, no fast/slow split
  - gw_3_layer_glogem     # S2: fast + slow + deep GW
  - glacier_soil_glogem   # S3: MASKED_GLACIER gets soil profile, meltwater infiltrates
  - glacier_gw_glogem     # S5: SPHY-style split PONDED -> GlacROF*SW + (1-GlacROF)*SLOW

calibration:
  metrics: [KGE, KGE_WB]
  iterations: 3000
  ngs: 15

future:
  enabled: false
