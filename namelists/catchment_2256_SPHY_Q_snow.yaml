# =============================================================================
# Catchment 2256 - Rosegbach @ Pontresina — SPHY, Q+snow calibration
# =============================================================================
# Replicates the 2268 Q+snow setup on a second Swiss catchment as part of
# Phase 3.2 expansion. Rosegbach is the "interesting outlier" from the
# base-model selection — opt2 had a +0.116 KGE_WB advantage on this
# catchment, the only one where the SPHY-faithful percolation was
# substantially ahead of HBV-Light. Re-running with the chosen opt1
# baseline + snow constraint tests whether the multi-objective setup
# recovers performance here.
#
# Output routes to:
#   model_runs/catchment_2256/configs/glogem_subdaily_opt1/SPHY_Q_snow/
# =============================================================================

catchment: '2256'
display_name: 'Rosegbach @ Pontresina'
region: 'switzerland'

start_date: '2000-01-01'
end_date: '2020-12-31'
cali_end_date: '2010-12-31'
warm_up_date: '1990-01-01'

warmup:
  method: 'real'

precip_correction: true

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1

calibration:
  metrics: ['Q_snow']
  iterations: 3000
  ngs: 15

  objectives: [Q, snow]
  weights:
    Q:    0.7
    snow: 0.3
  Q:
    metric: KGE
  snow:
    metric: RMSE
    aggregation: elevation_band
    band_width_m: 100
    min_pixels_per_band: 5     # small Swiss catchment
    band_aggregation: area_weighted_mean
    cloud_threshold: 0.5

future:
  enabled: false
