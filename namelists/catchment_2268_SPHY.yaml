# =============================================================================
# Catchment 2268 - Rhone @ Gletsch — SPHY production (cell C: Q + snow)
# =============================================================================
# Production calibration after the base-model selection (see
# cross_catchment_plots/sphy_option_comparison/ for the 4-config sweep that
# led to choosing opt1 + per-HRU). Multi-objective with elevation-band MODIS
# fSCA as the second target.
#
# Companion namelists for the experimental matrix:
#   catchment_2268_SPHY.yaml             ← this file (cell C: Q + snow)
#   catchment_2268_SPHY_full.yaml        ← cell E (Q + snow + baseflow)
# Baseline (cell A: Q only) is archived in model_runs_finding_base_model/
# from the base-model selection runs.
# =============================================================================

catchment: '2268'
display_name: 'Rhone @ Gletsch'
region: 'switzerland'

start_date: '2000-01-01'
end_date: '2020-12-31'
cali_end_date: '2010-12-31'
warm_up_date: '1990-01-01'

# Use real pre-simulation data for warm-up — MeteoSwiss/CAMELS-CH/GloGEM
# all cover 1981+ so 1990-1999 is available as observed forcing.
warmup:
  method: 'real'

# MeteoSwiss is gauge-adjusted, so expect Cx close to 1.0; calibrate anyway
# for consistency with the Indus SPHY runs.
precip_correction: true

models:
  - SPHY

# Locked to opt1 (HBV-Light, per-HRU) per the base-model selection. The
# 4-config sweep showed opt2 had a 0.04-0.07 KGE_WB edge on most catchments
# but within calibration noise (Schaefli & Gupta 2007), and KGE_winter
# actually favours opt1 — parsimony argument (Beven 2006) selects opt1.
# `_shared` variants dropped: per-HRU storage won 7/8 catchments in the
# sweep, with sound physical reasoning (downslope-dominated alpine drainage).
configurations:
  - glogem_subdaily_opt1

calibration:
  # Legacy `metrics:` kept so the multi-metric runner script (which reads
  # this field independently of the new `objectives:`) still launches both
  # the KGE and KGE_WB calibration variants per config.
  metrics: [KGE, KGE_WB]
  iterations: 3000
  ngs: 15

  # ── Multi-objective: cell C of the experimental matrix ───────────────
  # Triggers MODIS fSCA derivation in STEP 5d of create_input_files (gated
  # on `'snow' in objectives`). Reads the region NetCDF for Switzerland,
  # clips to this catchment, masks RGI glaciers, aggregates per 100 m band.
  # Empirically validated: ~10 s preprocessing on 2268.
  objectives: [Q, snow]
  weights:
    Q:    0.7
    snow: 0.3
  Q:
    metric: KGE                 # plain KGE; KGE_WB redundant with explicit
                                # baseflow objective if we ever add one.
  snow:
    metric: RMSE                # bounded [0, 1] for fSCA — Tahir 2011 style.
                                # KGE on fSCA is unstable for tail bands
                                # (near-zero variance) — RMSE behaves well.
    aggregation: elevation_band # Finger 2015 WRR — distributed by elevation
                                # band beats basin-mean for alpine catchments
                                # because it identifies the snowline elevation
                                # directly. Defensible in a methods section.
    band_width_m: 100           # Matches the HRU elevation discretization
                                # (criteria: [elevation, landuse] with
                                #  elevation_distance: 100). One HRU per
                                # band per landuse class → clean sim
                                # aggregation per band.
    min_pixels_per_band: 5      # Small Swiss catchment (~30 km², ~330
                                # MODIS pixels post-clip) → loosen the
                                # default 30. For Indus catchments use 30.
    band_aggregation: area_weighted_mean
    cloud_threshold: 0.5

future:
  enabled: false
