# =============================================================================
# Catchment 2268 - Rhone @ Gletsch (Switzerland) — SPHY model_type test
# =============================================================================
# Server production run testing the SPHY model_type on a Swiss alpine
# catchment with MeteoSwiss forcing (via region: switzerland). Two-axis
# matrix: {opt1 HBV-Light, opt2 SPHY-faithful} percolation. No TPHiPr —
# Swiss catchments use MeteoSwiss precip from the region layer override.
# Companion to namelists/catchment_2268.yaml (HBV runs).
# =============================================================================

catchment: '2268'
display_name: 'Rhone @ Gletsch'
region: 'switzerland'

start_date: '2000-01-01'
end_date: '2020-12-31'
cali_end_date: '2010-12-31'
warm_up_date: '1990-01-01'

# Use real pre-simulation data for warm-up — MeteoSwiss/CAMELS-CH/GloGEM
# all cover 1981+ so 1990-1999 is available as observed forcing.
warmup:
  method: 'real'

# MeteoSwiss is gauge-adjusted, so expect Cx close to 1.0; calibrate anyway
# for consistency with the Indus SPHY runs.
precip_correction: true

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1          # MeteoSwiss (via region) + perc opt 1 (HBV-Light)
  - glogem_subdaily_opt2          # MeteoSwiss (via region) + perc opt 2 (SPHY-faithful)
  - glogem_subdaily_opt1_shared   # opt 1 + shared subsurface (HBV-EC-style)
  - glogem_subdaily_opt2_shared   # opt 2 + shared subsurface

calibration:
  metrics: [KGE, KGE_WB]
  iterations: 3000
  ngs: 15

future:
  enabled: false
