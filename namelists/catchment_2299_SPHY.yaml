# =============================================================================
# Catchment 2299 - Alpbach @ Erstfeld, Bodenberg (Switzerland) — SPHY
# =============================================================================
# Uri alpine headwater (Reuss/Aare system), small catchment. MeteoSwiss forcing
# via region: switzerland. Two-axis matrix: {perc opt1/opt2} x
# {per-HRU/shared subsurface storage}.
# =============================================================================

catchment: '2299'
display_name: 'Alpbach @ Erstfeld, Bodenberg'
region: 'switzerland'

start_date: '2000-01-01'
end_date: '2020-12-31'
cali_end_date: '2010-12-31'
warm_up_date: '1990-01-01'

# Use real pre-simulation data for warm-up (MeteoSwiss + CAMELS-CH + GloGEM
# all cover 1990+).
warmup:
  method: 'real'

# MeteoSwiss is gauge-adjusted, so expect Cx close to 1.0; calibrate anyway
# for consistency with the Indus SPHY runs.
precip_correction: true

models:
  - SPHY

configurations:
  - glogem_subdaily_opt1          # MeteoSwiss (via region) + perc opt 1 (HBV-Light)
  - glogem_subdaily_opt2          # MeteoSwiss (via region) + perc opt 2 (SPHY-faithful)
  - glogem_subdaily_opt1_shared   # opt 1 + shared subsurface (HBV-EC-style)
  - glogem_subdaily_opt2_shared   # opt 2 + shared subsurface

calibration:
  metrics: [KGE, KGE_WB]
  iterations: 3000
  ngs: 15

future:
  enabled: false
