# =============================================================================
# Namelist for gauge 0101 (coupled, GloGEM TSLA, subdaily melt) — FUTURE RUN
# Based on namelist_0101_glogem_subdaily.yaml with calibrated parameters
# Climate model: GFDL-ESM4, Scenario: SSP1-2.6
# =============================================================================

gauge_id: '0101'
start_date: '1981-01-01'
end_date: '2100-09-30'
warm_up_date: '1980-01-01'

model_type: 'HBV'
template: false
cali_end_date: '2100-09-30'
main_dir: '/home/jberg/OneDrive/Raven_worldwide'
config_dir: 'test_config_all/03_model_setups_glogem_subdaily_future'
debug: true

coupled: true
glogem_model: 'gfdl-esm4'
glogem_scenario: 'ssp126'
subdaily_method: 'SUBDAILY_HOURLY_MELT'

nconnect: 'multiple'
criteria:
  - elevation
  - landuse

meteo_source: 'ERA5'
future: true

# =============================================================================
# CMIP6 climate projection settings
# =============================================================================
cmip6_dir: '/home/jberg/OneDrive/Raven_worldwide/01_data/CMIP6'
cmip6_models:
  - GFDL-ESM4
cmip6_scenarios:
  - historical
  - ssp126
cmip6_train_start: '1980-01-01'
cmip6_train_end: '2014-12-31'

# =============================================================================
# Paths (relative to main_dir or absolute)
# =============================================================================
meteo_dir: '/home/jberg/OneDrive/Raven_worldwide/01_data/meteo/Indus-Era5'
meteo_har_dir: '/home/jberg/OneDrive/Raven_worldwide/01_data/meteo/HAR'
shape_dir: '01_data/topo/catchment_shapefile/catchment_shape_{gauge_id}.shp'
raster_dir: '01_data/topo/catchment_dem/dem_Indus.tif'
stream_dir: '01_data/streamflow/streamflow_{gauge_id}.csv'
landuse_dir: '01_data/topo/catchment_landuse/landuse_Indus_30m.tif'
glacier_dir: '01_data/topo/glacier_outlines/nsidc0770_14.rgi60.SouthAsiaWest/14_rgi60_SouthAsiaWest.shp'
glogem_dir: '01_data/GloGEM/Indus/Snowline'
params_dir: '../src/config/calibrated_params_glogem_subdaily_0101.yaml'

# =============================================================================
# Forcing file templates (populated by meteo preprocessors)
# =============================================================================
