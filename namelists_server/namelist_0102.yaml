# =============================================================================
# Namelist for gauge 0102
# =============================================================================

gauge_id: '0102'
start_date: '1980-01-01'
end_date: '2014-12-31'
cali_end_date: '1999-12-31'
warm_up_date: '1978-01-01'

# Model type: 'HBV', 'HYMOD', 'HMETS', 'MOHYSE'
model_type: 'HBV'
template: true
main_dir: '/home/jberg@giub.local/Raven_world'
config_dir: 'test_march/03_model_setups'
debug: true

# --- Glacier coupling ---
# glacier_dir: always used (when set) for RGI-based glacier HRU delineation
# coupled: true  → GloGEM handles glacier melt externally; HRUs = MASKED_GLACIER (class 8),
#                   Raven glacier processes INACTIVE (requires glogem_dir)
# coupled: false → Raven handles glacier melt internally; HRUs = GLACIER (class 7),
#                   Raven glacier processes ACTIVE
coupled: false

# --- HRU discretization ---
# Lateral connections: 'multiple' (HRU connects to multiple HRUs downstream) or 'single'
nconnect: 'multiple'
# Possible discretization criteria: 'elevation', 'landuse', 'aspect', 'slope'
criteria:
  - elevation
  - landuse
# Minimum slope (degrees) to split HRUs by aspect (only used when 'aspect' is in criteria)
#aspect_slope_threshold: 15.0

# --- Landuse source ---
# 'ESA' (landuse_{gauge_id}.tif, values 10-220), 'ICIMOD' (hkh_lc-2021.tif, values 1-9),
# or 'auto' (detect from raster values). If omitted, defaults to auto-detection.
#landuse_source: 'ESA'

# --- Meteorological forcing ---
# Choose primary forcing dataset: 'ERA5' or 'HAR'
meteo_source: 'ERA5'

# Optional: override precipitation with TPHiPr (~3 km gridded product)
# Temperatures stay from meteo_source; only precip is replaced.
#precip_source: 'TPHiPr'
#tphipr_dir: '/home/jberg@giub.local/Raven_world/01_data/meteo/TPHiPr'

# --- Climate projections (future runs) ---
future: false

# CORDEX regional climate projections (CMIP5-era RCM downscaling)
# Requires future: true. QDM bias-corrects CORDEX to ERA5-Land grid.
# Training period default: 1980-2005 (CORDEX historical intersected with ERA5-Land)
#cordex_dir: '/home/jberg@giub.local/Raven_world/01_data/CORDEX'
#cordex_models:
#  - SMHI-RCA_MPIESM
#cordex_scenarios:
#  - historical
#  - rcp45
#  - rcp85
#cordex_train_start: '1980-01-01'
#cordex_train_end:   '2005-12-31'

# CMIP6 raw GCM projections (ISIMIP3b-compatible models)
# Requires future: true. QDM bias-corrects CMIP6 to ERA5-Land grid.
# Training period default: 1980-2014 (CMIP6 historical ends 2014)
# Available ISIMIP3b models: GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL
#cmip6_dir: '/home/jberg@giub.local/Raven_world/01_data/CMIP6'
#cmip6_models:
#  - GFDL-ESM4
#cmip6_scenarios:
#  - historical
#  - ssp126
#  - ssp585
#cmip6_train_start: '1980-01-01'
#cmip6_train_end:   '2014-12-31'

# --- Multi-subbasin mode ---
# Uncomment to enable nested multi-subbasin routing.
# Each entry needs: id, gauge_id, name, gauged (0/1), reach_length ('_AUTO' or meters), profile
#subbasins:
#  - {id: 1, gauge_id: '0102', name: 'Main', gauged: 1, reach_length: '_AUTO', profile: 'NONE'}

# --- GloGEM glacier model settings (only used when coupled: true, i.e. external glacier melt) ---
#basin_name: 'Indus'
#glogem_scenario: 'ssp126'
# Which GloGEM variable to use for irrigation forcing: 'discharge', 'icemelt', 'snowmelt', 'rain'
#irrigation_variable: 'discharge'

# =============================================================================
# Paths (relative to main_dir or absolute)
# =============================================================================
meteo_dir: '/home/jberg@giub.local/Raven_world/01_data/meteo/Indus-Era5'
meteo_har_dir: '/home/jberg@giub.local/Raven_world/01_data/meteo/HAR'
shape_dir: '01_data/topo/catchment_shapefile/catchment_shape_{gauge_id}.shp'
raster_dir: '01_data/topo/catchment_dem/dem_Indus.tif'
stream_dir: '01_data/streamflow/streamflow_{gauge_id}.csv'
landuse_dir: '01_data/topo/catchment_landuse/landuse_Indus_30m.tif'
glacier_dir: '01_data/topo/glacier_outlines/nsidc0770_14.rgi60.SouthAsiaWest/14_rgi60_SouthAsiaWest.shp'
glogem_dir: '01_data/GloGEM/Indus/GMB'
params_dir: '../src/config/default_params.yaml'

# =============================================================================
# Forcing file templates (populated by meteo preprocessors)
# =============================================================================
forcing_files:
  - 'era5_land_2m_temperature_2000-2000_daily_max_combined.nc'
  - 'era5_land_2m_temperature_2000-2000_daily_min_combined.nc'
  - 'era5_land_2m_temperature_2000-2000_daily_mean_combined.nc'
  - 'era5_land_total_precipitation_2000-2000_daily_combined.nc'

forcing_files_har:
  - 'har_land_2m_temperature_2000-2000_daily_max_combined.nc'
  - 'har_land_2m_temperature_2000-2000_daily_min_combined.nc'
  - 'har_land_2m_temperature_2000-2000_daily_mean_combined.nc'
  - 'har_land_total_precipitation_2000-2000_daily_combined.nc'

# =============================================================================
# Calibration settings
# =============================================================================
calibration:
   metrics:
     primary: 'KGE'           # Primary metric: 'KGE', 'NSE', 'PBIAS', 'RMSE'
     secondary: ['NSE', 'PBIAS', 'RMSE']
   iterations: 10              # Number of SCE-UA iterations
   ngs: 2                     # Number of complexes in SCE-UA
   cali_end_date: '1999-12-31'
   vali_end_date: '2014-12-31'

raven_executable: '/home/jberg@giub.local/RavenHydroFramework/build/Raven'
