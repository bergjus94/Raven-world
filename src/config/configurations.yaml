# =============================================================================
# Central registry of all 15 model configurations
# Used by postprocessing_configurations.py for multi-config comparisons
# =============================================================================
# Top-level settings:
#   main_dir:       root directory containing all configuration folders
#                   (overrides main_dir from individual namelists)
# Per-config fields:
#   key:            config suffix (maps to namelist filename and config_dir)
#   display_name:   descriptive name for plot legends/titles
#   color:          hex color for consistent plotting
#   coupled:        boolean (determines which contribution plots apply)
#   glacier_source: 'glogem' | 'raven_deltah' | 'none'
# =============================================================================

# Set this to the folder that contains all configuration output folders
main_dir: '/home/jberg/OneDrive/Raven_worldwide'

configurations:
  - key: 'baseline'
    display_name: 'ERA5 Baseline'
    color: '#1f77b4'
    coupled: false
    glacier_source: 'none'

  - key: 'coupled'
    display_name: 'ERA5 Coupled'
    color: '#ff7f0e'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_aspect'
    display_name: 'ERA5 Coupled Aspect'
    color: '#e6ab02'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_gmb'
    display_name: 'ERA5 Coupled GMB'
    color: '#2ca02c'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_har'
    display_name: 'HAR Coupled'
    color: '#d62728'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_icimod'
    display_name: 'ERA5 Coupled ICIMOD'
    color: '#9467bd'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_tphipr'
    display_name: 'ERA5 Coupled TPHiPr'
    color: '#8c564b'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_subdaily'
    display_name: 'ERA5 Coupled Subdaily'
    color: '#e377c2'
    coupled: true
    glacier_source: 'glogem'

  - key: 'coupled_subdaily_icemelt'
    display_name: 'ERA5 Coupled Subdaily Icemelt'
    color: '#7f7f7f'
    coupled: true
    glacier_source: 'glogem'
    icemelt_mode: true

  - key: 'coupled_subdaily_icimod_gmb'
    display_name: 'ERA5 Coupled Subdaily ICIMOD+GMB'
    color: '#bcbd22'
