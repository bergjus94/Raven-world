# =============================================================================
# Central registry of model configurations
# Used by postprocessing_configurations.py for multi-config comparisons
# =============================================================================
# Top-level settings:
#   main_dir:       root directory containing all configuration folders
#                   (overrides main_dir from individual namelists)
# Per-config fields:
#   key:            config suffix (maps to namelist filename and config_dir)
#   display_name:   descriptive name for plot legends/titles
#   color:          hex color for consistent plotting
#   coupled:        boolean (determines which contribution plots apply)
#   glacier_source: 'glogem' | 'none'
#   icemelt_mode:   true for icemelt configs (glacier HRUs are ROCK)
# =============================================================================

# Set this to the folder that contains all configuration output folders
main_dir: '/home/jberg/OneDrive/Raven_worldwide'

configurations:
  # === UNCOUPLED (Raven internal glacier model) ===
  - key: 'baseline'
    display_name: 'HBV'
    color: '#1f77b4'
    coupled: false
    glacier_source: 'none'

  - key: 'subdaily'
    display_name: 'HBV Subdaily'
    color: '#aec7e8'
    coupled: false
    glacier_source: 'none'

  - key: 'icimod'
    display_name: 'HBV ICIMOD'
    color: '#9467bd'
    coupled: false
    glacier_source: 'none'

  - key: 'har'
    display_name: 'HBV HAR'
    color: '#d62728'
    coupled: false
    glacier_source: 'none'

  - key: 'subdaily_aspect'
    display_name: 'HBV Subdaily Aspect'
    color: '#98df8a'
    coupled: false
    glacier_source: 'none'

  - key: 'oudin'
    display_name: 'HBV Oudin'
    color: '#c5b0d5'
    coupled: false
    glacier_source: 'none'

  # === COUPLED (GloGEM external glacier model) ===
  - key: 'glogem'
    display_name: 'HBV GloGEM'
    color: '#ff7f0e'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_subdaily'
    display_name: 'HBV GloGEM Subdaily'
    color: '#e377c2'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_icimod'
    display_name: 'HBV GloGEM ICIMOD'
    color: '#ff9896'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_har'
    display_name: 'HBV GloGEM HAR'
    color: '#bcbd22'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_subdaily_aspect'
    display_name: 'HBV GloGEM Subdaily Aspect'
    color: '#17becf'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_oudin'
    display_name: 'HBV GloGEM Oudin'
    color: '#e6ab02'
    coupled: true
    glacier_source: 'glogem'

  - key: 'glogem_gmb'
    display_name: 'HBV GloGEM GMB'
    color: '#2ca02c'
    coupled: true
    glacier_source: 'glogem'

  # === ICEMELT (GloGEM icemelt injection, glacier HRUs as ROCK) ===
  - key: 'icemelt'
    display_name: 'HBV Icemelt'
    color: '#8c564b'
    coupled: true
    glacier_source: 'glogem'
    icemelt_mode: true

  - key: 'icemelt_subdaily'
    display_name: 'HBV Icemelt Subdaily'
    color: '#7f7f7f'
    coupled: true
    glacier_source: 'glogem'
    icemelt_mode: true
