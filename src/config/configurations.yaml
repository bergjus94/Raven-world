    color: '#ff9896'
    coupled: false
    glacier_source: 'raven_deltah'

  - key: 'deltah_subdaily_tphipr'
    display_name: 'ERA5 DeltaH Subdaily TPHiPr'
    color: '#c5b0d5'
    coupled: false
    glacier_source: 'raven_deltah'
