    glacier_source: 'glogem'

  - key: 'coupled_subdaily_oudin'
    display_name: 'ERA5 Coupled Subdaily Oudin'
    color: '#17becf'
    coupled: true
    glacier_source: 'glogem'

  - key: 'deltah'
    display_name: 'ERA5 DeltaH'
    color: '#aec7e8'
    coupled: false
    glacier_source: 'raven_deltah'

  - key: 'deltah_subdaily'
    display_name: 'ERA5 DeltaH Subdaily'
    color: '#ffbb78'
    coupled: false
    glacier_source: 'raven_deltah'

  - key: 'deltah_subdaily_aspect'
    display_name: 'ERA5 DeltaH Subdaily Aspect'
    color: '#98df8a'
    coupled: false
    glacier_source: 'raven_deltah'

  - key: 'deltah_subdaily_icimod'
