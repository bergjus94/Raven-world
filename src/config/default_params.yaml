# Default Parameters for Raven Hydrological Models
# This file contains parameter definitions, initial values, and bounds for calibration
# Author: Justine Berg
# Date: November 2025

GR4J:
  # GR4J + CemaNeige snow model parameters
  names:
    GR4J_X1: Gr4j_x1                    # Production store capacity [mm]
    GR4J_X2: Gr4j_x2                    # Groundwater exchange coefficient [mm]
    GR4J_X3: Gr4j_x3                    # Routing store capacity [mm]
    GR4J_X4: Gr4j_x4                    # Unit hydrograph time constant [days]
    CEMANEIGE_X1: Cemaneige_X1          # avg annual snow as SWE [mm]
    CEMANEIGE_X2: Cemaneige_X2          # Degree-day melt factor [mm/°C/day]
    Airsnow_Coeff: Airsnow_Coeff        # air/snow heat transfer coefficient [1/d] Derived: 1.0 - CEMANEIGE_X2

  init:
    GR4J_X1: 0.529                      # Production store capacity
    GR4J_X2: -3.396                     # Groundwater exchange coefficient
    GR4J_X3: 407.29                     # Routing store capacity
    GR4J_X4: 1.072                      # Unit hydrograph time constant
    CEMANEIGE_X1: 16.9                  # avg annual snow as SWE
    CEMANEIGE_X2: 0.947                 # Degree-day melt factor
    Airsnow_Coeff: 0.053                # Derived: 1.0 - 0.947

  lower:
      GR4J_X1: 0.01
      GR4J_X2: -15.0
      GR4J_X3: 10.0
      GR4J_X4: 0.0
      CEMANEIGE_X1: 1.0
      CEMANEIGE_X2: 0.0
  upper:
      GR4J_X1: 2.5
      GR4J_X2: 10.0
      GR4J_X3: 700.0
      GR4J_X4: 7.0
      CEMANEIGE_X1: 30.0
      CEMANEIGE_X2: 1.0

HBV:
  # HBV-EC (Environment Canada) model parameters
  names:
    X01: HBV_RainSnow_Temp              # Rain/snow transition temperature [°C]
    X02: HBV_Melt_Factor                # Snow melt factor [mm/d/°C]
    X03: HBV_Refreeze_Factor            # Refreeze factor [mm/d/°C]
    X04: HBV_Snow_SWI                   # Snow water saturation [-]
    #X05: HBV_Porosity                   # Soil porosity [-] — fixed at 1.0 (conceptual reservoir, not physical soil)
    X06: HBV_Field_Capacity             # Field capacity [-]
    X07: HBV_Beta                       # Infiltration exponent [-]
    X08: HBV_Max_Perc_Rate             # Percolation rate [mm/d]
    X09: HBV_Baseflow_Coeff_Fast        # Fast reservoir baseflow [1/d]
    X10: HBV_Baseflow_Coeff_Slow        # Slow reservoir baseflow [1/d]
    X11: HBV_T_Conc_Max_Bas             # Time of concentration [d]
    #X12: HBV_Precip_Lapse               # Precipitation lapse rate [mm/d/km]
    #X13: HBV_Adiabatic_Lapse            # Temperature lapse rate [°C/km]
    #X14: HBV_Sat_Wilt                   # Wilting point saturation [-] — fixed at 0.0 (not in standard HBV)
    X15: HBV_Baseflow_N                  # Baseflow exponent [-]
    X16: HBV_Max_Cap_Rise_Rate          # Capillary rise rate [mm/d]
    X17: HBV_Thickness_Topsoil          # Topsoil thickness [m]
    X18: HBV_Melt_For_Corr               # Forest melt correction [-]
    X19: HBV_Glac_Storage_Coeff          # Glacier storage coefficient [-]
    X20: HBV_Rain_Corr                   # Rain correction factor [-]
    X21: HBV_Snow_Corr                   # Snow correction factor [-]
    X22: HBV_Perc_Slow_To_Deep            # Percolation SLOW→DEEP [mm/d]
    X23: HBV_Baseflow_Coeff_Deep          # Deep GW baseflow [1/d]
    X24: HBV_GlacROF                      # Glacier fast-runoff fraction (SPHY-style split) [-]
    HBV_Time_To_Peak: HBV_Time_To_Peak # Derived: X11 / 2
    HBV_Initial_Thickness_Topsoil: HBV_Initial_Thickness_Topsoil  # Derived: X17 * 500

  init:
    X01: 0.05984519                     # Rain/snow temp
    X02: 4.072232                       # Melt factor
    X03: 2.001574                       # Refreeze factor
    X04: 0.03473693                     # Snow SWI
    #X05: 1.0                            # Porosity — fixed
    X06: 0.506052                       # Field capacity
    X07: 3.0                             # Beta
    X08: 3.0                             # Max perc rate
    X09: 0.4606565                      # Fast baseflow
    X10: 0.06303738                     # Slow baseflow
    X11: 2.277781                       # Time of concentration
    #X12: 4.873686                       # Precip lapse
    #X13: 0.5718813                      # Adiabatic lapse
    #X14: 0.0                            # Sat wilt — fixed
    X15: 0.877607                       # Baseflow N
    X16: 0.5                             # Cap rise rate
    X17: 0.25                            # Topsoil thickness
    X18: 0.4452843                      # Forest correction
    X19: 0.6771759                       # Glacier storage
    X20: 1.0                             # Rain correction (single Cx; = 1.0 means no correction)
    X21: 1.0                             # Snow correction (tied to X20 via _get_tied_parameters — never separately calibrated)
    X22: 1.0                             # Perc slow to deep
    X23: 0.001                           # Deep baseflow
    X24: 0.7                             # GlacROF: fast fraction of glacier melt (SPHY default, Lutz 2014)
    HBV_Time_To_Peak: 1.1388905         # Derived: X11 / 2
    HBV_Initial_Thickness_Topsoil: 125.0      # Derived: X17 * 500


  lower:
      X01: -3.0
      X02: 2.3
      X03: 0.0
      X04: 0.0
      #X05: 1.0                    # POROSITY — fixed at 1.0
      X06: 0.3
      X07: 1.0
      X08: 0.0
      X09: 0.05
      X10: 0.001
      X11: 0.01
      #X12: 0.0
      #X13: 0.0                    # ADIABATIC_LAPSE — fixed at 6.0 in HBV preprocessor, not calibrated
      #X14: 0.0                    # SAT_WILT — fixed at 0.0
      X15: 1.0                            # baseflow exponent: ≥1 for glacier-fed catchments (linear to mild nonlinearity)
      X16: 0.0
      X17: 0.05
      X18: 0.0
      X19: 0.05
      X20: 0.8
      # X21 bounds omitted — tied to X20 via _get_tied_parameters (single-factor precip correction)
      X22: 0.0
      X23: 0.0003
      X24: 0.5                              # GlacROF lower: 50% fast runoff
  upper:
      X01: 3.0
      X02: 10.0
      X03: 8.0
      X04: 0.1
      #X05: 1.0                    # POROSITY — fixed at 1.0
      X06: 1.0
      X07: 6.0
      X08: 10.0                             # percolation: capped at 10 mm/d (Konz & Seibert 2010, glacierized Himalaya)
      X09: 0.5
      X10: 0.1
      X11: 6.0
      #X12: 5.0
      #X13: 5.0                    # ADIABATIC_LAPSE — fixed at 6.0 in HBV preprocessor, not calibrated
      #X14: 0.0                    # SAT_WILT — fixed at 0.0
      X15: 3.0                             # capped: high exponents kill winter baseflow in glacier-fed catchments
      X16: 2.0                              # capillary rise: 0-2 mm/d (Seibert 2005, Lindström 1997)
      X17: 0.5
      X18: 2.0
      X19: 1.0
      X20: 1.5
      # X21 bounds omitted — tied to X20 via _get_tied_parameters
      X22: 2.0                              # perc slow→deep: 0-2 mm/d
      X23: 0.005                            # deep baseflow: ~200d to ~9yr residence
      X24: 0.9                              # GlacROF upper: 90% fast runoff (SPHY range 0.5-0.9 per Lutz 2014)

  # Optional parameters: only included in calibration when the condition is met.
  # Conditions: 'not_coupled' (included when coupled: false),
  #             'precip_correction' (included when precip_correction: true in namelist)
  optional:
      X08: 'has_slow_reservoir'      # MAX_PERC_RATE — only with 2+ reservoirs
      X10: 'has_slow_reservoir'      # K2 — only with slow reservoir
      X16: 'has_slow_reservoir'      # MAX_CAP_RISE_RATE — only with fast+slow
      X22: 'has_deep_reservoir'      # PERC_SLOW_TO_DEEP — only with deep GW
      X23: 'has_deep_reservoir'      # K3 — only with deep GW
      X24: 'has_glacier_split'       # GlacROF — only with glacier_routing='split_to_slow'
      X19: 'not_coupled'
      X20: 'precip_correction'           # Single bulk Cx; X21 is tied to X20 (see spotpy_optimize._get_tied_parameters)

SPHY:
  # SPHY-style HMA base model — process choices locked in
  # RavenHydroFramework/docs/model_structure_decisions.md (see also
  # src/preprocess_SPHY.py for how each X-number lands in the .rvp/.rvh).
  # Two intra-model variants currently:
  #   perc_option=1 (HBV-Light)    — calibrates X11 only (FAST_RES MAX_PERC_RATE)
  #   perc_option=2 (SPHY-faithful) — calibrates X12, X13, X14 (TOPSOIL MAX_PERC_RATE,
  #                                   PERC_N, PERC_COEFF). X11 is silent under opt2.
  # X11 and X12 are physically different (FAST→SLOW peak vs TOPSOIL→FAST peak) so
  # they get separate X-numbers and bounds.
  names:
    X01: Sphy_RainSnow_Temp             # Rain/snow transition centre [°C]
    X02: Sphy_Melt_Factor               # Snow melt factor [mm/d/°C]
    X03: Sphy_CFR                       # Refreeze coupling ratio [-] — drives REFREEZE_FACTOR
    X04: Sphy_Snow_SWI                  # Snow water-holding fraction [-]
    X05: Sphy_HBV_Beta                  # HBV-β infiltration exponent [-]
    X06: Sphy_Field_Capacity            # Field capacity [-]
    X07: Sphy_Baseflow_Coeff_Fast       # Fast reservoir baseflow [1/d]
    X08: Sphy_Baseflow_Coeff_Slow       # Slow reservoir baseflow [1/d]
    X09: Sphy_T_Conc                    # Time of concentration [d]
    X10: Sphy_Thickness_Topsoil         # Topsoil thickness [m]
    X11: Sphy_Max_Perc_Rate_Fast        # PERC_CONSTANT FAST→SLOW peak rate [mm/d] (opt1 only)
    X12: Sphy_Max_Perc_Rate_Topsoil     # PERC_POWER_LAW TOPSOIL→FAST peak rate [mm/d] (opt2 only)
    X13: Sphy_Perc_N                    # PERC_POWER_LAW exponent on TOPSOIL [-] (opt2 only)
    X14: Sphy_Perc_Coeff                # PERC_LINEAR coefficient on FAST_RES [1/d] (opt2 only)
    X15: Sphy_Max_Cap_Rise_Rate         # Capillary rise rate [mm/d]
    X16: Sphy_GlacROF                   # Glacier fast-runoff fraction (SPHY GlacF, Config D only) [-]
    X17: Sphy_UZL_Threshold             # STORAGE_THRESHOLD for BASE_THRESH_STOR on FAST_RES [mm] (Paper-5 S3/S4 only)
    X18: Sphy_K0_Fast_Threshold         # BASEFLOW_COEFF2 for BASE_THRESH_STOR on FAST_RES [1/d] (Paper-5 S3/S4 only)
    # Tied parameters use a Sphy_ prefix so the placeholder name never
    # collides with Raven's literal column names in :Parameters headers
    # (the substitution does a naive str.replace, see _write_parameters_to_file
    # in spotpy_optimize.py).
    Sphy_Time_To_Peak: Sphy_Time_To_Peak   # Derived: X09 / 2
    Sphy_Min_Melt_Factor: Sphy_Min_Melt_Factor   # Derived: 0.4 × X02
    Sphy_Refreeze_Factor: Sphy_Refreeze_Factor   # Derived: X03 × X02

  init:
    X01: 0.571782              # Rain/snow temp (0122 prior)
    X02: 5.0                   # Melt factor
    X03: 0.07                  # CFR (HBV-Light typical, Bergstrom 1976)
    X04: 0.05                  # SNOW_SWI (SPHY default)
    X05: 1.13565               # HBV_BETA (0122 prior)
    X06: 0.409336              # Field capacity (0122 prior)
    X07: 0.49104               # FAST baseflow (0122 prior)
    X08: 0.00211034            # SLOW baseflow (0122 prior)
    X09: 2.277781              # TIME_CONC (0122 prior)
    X10: 0.38655               # Topsoil thickness (0122 prior)
    X11: 8.37112               # FAST_RES MAX_PERC_RATE — opt1 prior (0122 opt1 reference)
    X12: 6.0                   # TOPSOIL MAX_PERC_RATE — opt2 prior (0122 opt2 reference)
    X13: 2.0                   # PERC_N (opt2 only; FUSE / Clark 2008 mid-range)
    X14: 0.15                  # PERC_COEFF (opt2 only; gives ~7.5 mm/d at 50 mm storage)
    X15: 1.88647               # MAX_CAP_RISE_RATE (0122 prior)
    X16: 0.7                   # GlacROF (SPHY default, Lutz 2014)
    X17: 20.0                  # UZL/STORAGE_THRESHOLD (HBV-Light typical mid-range, Seibert & Vis 2012)
    X18: 0.3                   # K0/BASEFLOW_COEFF2 (HBV-Light fast rate, ~3-day Q0 residence)
    Sphy_Time_To_Peak: 1.1388905   # Derived: X09 / 2
    Sphy_Min_Melt_Factor: 2.0      # Derived: 0.4 × 5.0
    Sphy_Refreeze_Factor: 0.35     # Derived: 0.07 × 5.0

  lower:
      X01: -3.0
      X02: 3.0          # MELT_FACTOR ≥ 3 (HMA literature lower bound)
      X03: 0.03         # CFR ≥ 0.03 (HBV-Light min, Seibert & Vis 2012)
      X04: 0.02         # SNOW_SWI: dense aged firn
      X05: 1.0          # HBV_BETA ≥ 1 (HBV convention)
      X06: 0.3
      X07: 0.01         # K1 FAST baseflow: ~100-day residence upper (HBV-Light Seibert & Vis 2012)
      X08: 0.001        # K2 SLOW baseflow: ~1000-day residence upper
      X09: 0.01
      X10: 0.05
      X11: 0.0          # FAST MAX_PERC_RATE: zero means no FAST→SLOW perc
      X12: 0.0          # TOPSOIL MAX_PERC_RATE: zero degenerates opt2 to no recharge
      X13: 1.0          # PERC_N ≥ 1 (degenerates to linear at 1)
      X14: 0.05         # PERC_COEFF: ~20-day residence upper (tightened from 0.01 to ensure non-degenerate FAST→SLOW transfer in cascade percolation)
      X15: 0.0
      X16: 0.5          # GlacROF: SPHY/Lutz lower bound
      X17: 5.0          # UZL: ≥5 mm threshold for Q0 (HBV-Light lower, Seibert & Vis 2012)
      X18: 0.1          # K0: ≥0.1 /day (slowest Q0 release, ~10-day above-threshold residence)
  upper:
      X01: 3.0
      X02: 8.0          # MELT_FACTOR ≤ 8 (HMA literature upper)
      X03: 0.20         # CFR ≤ 0.20 (cold dry continental, Anderson SNOW17)
      X04: 0.10         # SNOW_SWI: fresh fluffy snow
      X05: 5.0          # HBV_BETA ≤ 5 (HBV convention)
      X06: 1.0
      X07: 0.4          # K1 FAST baseflow: ~2.5-day residence lower (HBV-Light Seibert & Vis 2012)
      X08: 0.1          # K2 SLOW baseflow: ~10-day residence lower (HBV-Light convention; allows fast-recession bedrock-like storage for glacierized alpine)
      X09: 6.0
      X10: 1.5          # Topsoil thickness upper bound — matches SPHY HMA (Khanal 2022 Bhagirathi); was 0.5 (HBV lit)
      X11: 10.0         # FAST MAX_PERC_RATE cap (Konz & Seibert 2010, glacierized HMA)
      X12: 20.0         # TOPSOIL MAX_PERC_RATE: wider — opt2 has PERC_N as shape control
      X13: 5.0          # PERC_N upper (FUSE range)
      X14: 1.0          # PERC_COEFF: ~1-day residence lower
      X15: 2.0
      X16: 0.9          # GlacROF: SPHY/Lutz upper bound
      X17: 50.0         # UZL: ≤50 mm threshold for Q0 (HBV-Light upper, Seibert & Vis 2012)
      X18: 0.5          # K0: ≤0.5 /day (fastest Q0 release, ~2-day above-threshold residence)

  # Optional parameters: only included in calibration when the condition is met.
  # Conditions:
  #   'perc_option_1'    → only when perc_option == 1
  #   'perc_option_2'    → only when perc_option == 2
  #   'has_glacier_split' → only when glacier_routing in {'split_to_slow', 'split_to_fast'}
  #                         (Paper-5 S2/S4/S6 slow target; S7/S8/S9 fast target)
  #   'has_threshold_release' → only when fast_reservoir_release == 'threshold' (Paper-5 S3/S4)
  optional:
      X11: 'perc_option_1'           # FAST MAX_PERC_RATE — opt 1 only
      X12: 'perc_option_2'           # TOPSOIL MAX_PERC_RATE — opt 2 only
      X13: 'perc_option_2'           # PERC_N — opt 2 only
      X14: 'perc_option_2'           # PERC_COEFF — opt 2 only
      X16: 'has_glacier_split'       # GlacROF — split_to_slow OR split_to_fast
      X17: 'has_threshold_release'   # UZL — only when fast_reservoir_release='threshold'
      X18: 'has_threshold_release'   # K0 — only when fast_reservoir_release='threshold'

