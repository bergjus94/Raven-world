# Uncoupled, ERA5 forcing — DAILY melt (no :SubdailyMethod line).
# Override defaults.yaml's project-wide 'SUBDAILY_HOURLY_MELT' so this is
# genuinely a daily-melt baseline distinct from the `subdaily` config.
_config_key: 'baseline'
display_name: 'HBV'
color: '#1f77b4'
coupled: false
glacier_source: 'none'
subdaily_method: null

# Only HBV has internal glacier model for uncoupled mode
compatible_models: [HBV]
