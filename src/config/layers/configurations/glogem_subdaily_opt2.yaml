# SPHY: Coupled GloGEM TSLA + ERA5-Land forcing, subdaily melt, percolation Option 2
# (SPHY-faithful: PERC_POWER_LAW TOPSOIL→FAST + PERC_LINEAR FAST→SLOW).
# Mirrors glogem_subdaily.yaml fields but pins perc_option and restricts to SPHY.
_config_key: 'glogem_subdaily_opt2'
display_name: 'SPHY GloGEM ERA5 opt2'
color: '#aec7e8'
coupled: true
glacier_source: 'glogem'
glogem_model: 'gfdl-esm4'
glogem_scenario: 'ssp126'
basin_name: 'Indus'
irrigation_variable: 'discharge'
# Use TPhiPr for the lapse-rate regression even though ERA5 is the active
# meteo precip. Per decisions doc, TPhiPr is the right HMA gridded product
# for P-vs-z fitting. The switzerland region layer overrides this back to
# MeteoSwiss for Swiss catchments.
lapse_rate_precip_source: 'TPHiPr'
perc_option: 2
compatible_models: ['SPHY']
