glogem_scenario: 'ssp126'
basin_name: 'Indus'
irrigation_variable: 'discharge'
perc_option: 2
subsurface_structure: 'gw_2_layer'
glacier_routing: 'none'
fast_reservoir_release: 'linear'
land_surface_routing: 'direct'
compatible_models: ['SPHY']
