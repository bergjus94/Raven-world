# Paper 5 — Structure S9 (SPHY-faithful + glacier→FAST connectivity)
#
# Mirror of S6 with the :Split routing the (1-GlacROF) fraction to FAST_RES
# instead of SLOW_RES. In the SPHY-faithful architecture FAST_RES sits in
# the cascade percolation chain (TOPSOIL→FAST→SLOW) and releases via
# BASE_LINEAR — so glacier melt routed to FAST joins the cascade rather
# than bypassing it. Tests whether the destination of glacier-GW routing
# matters in the SPHY-faithful architecture (paper_5_methodology.md §4.7).
#
# Reference: paper_ideas/paper_5_methodology.md §4.7

_config_key: 'glogem_subdaily_opt2_sphy_faithful_glaciergw_fast'
