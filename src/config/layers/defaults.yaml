# =============================================================================
# Default settings shared across ALL namelist combinations
# Merge order: defaults <- env <- catchment <- configuration <- model
# =============================================================================

# --- Model defaults ---
model_type: 'HBV'
template: true
debug: true

# --- Glacier coupling default (uncoupled) ---
coupled: false

# --- Subdaily melt ---
subdaily_method: 'SUBDAILY_HOURLY_MELT'

# --- HRU discretization ---
nconnect: 'multiple'
criteria:
  - elevation
  - landuse

# --- Meteorological forcing default ---
meteo_source: 'ERA5'

# --- Climate projections ---
future: false

future_projections:
  enabled: true
  start_date: '1981-01-01'
  end_date: '2100-09-30'
  warm_up_date: '1980-01-01'
  models:
    - GFDL-ESM4
    - IPSL-CM6A-LR
    - MPI-ESM1-2-HR
    - MRI-ESM2-0
    - UKESM1-0-LL
  scenarios:
    - historical
    - ssp126

cmip6_train_start: '1980-01-01'
cmip6_train_end: '2014-12-31'

# --- Paths (relative to main_dir) ---
shape_dir: '01_data/topo/catchment_shapefile/catchment_shape_{gauge_id}.shp'
raster_dir: '01_data/topo/catchment_dem/dem_Indus.tif'
stream_dir: '01_data/streamflow/streamflow_{gauge_id}.csv'
landuse_dir: '01_data/topo/catchment_landuse/landuse_Indus_30m.tif'
landuse_dir_icimod: '01_data/topo/catchment_landuse/hkh_lc-2021.tif'
glacier_dir: '01_data/topo/glacier_outlines/nsidc0770_14.rgi60.SouthAsiaWest/14_rgi60_SouthAsiaWest.shp'
glogem_dir: '01_data/GloGEM/Indus/TSLA'
params_dir: 'default_params.yaml'

# --- Forcing file templates ---
forcing_files:
  - 'era5_land_2m_temperature_2000-2000_daily_max_combined.nc'
  - 'era5_land_2m_temperature_2000-2000_daily_min_combined.nc'
  - 'era5_land_2m_temperature_2000-2000_daily_mean_combined.nc'
  - 'era5_land_total_precipitation_2000-2000_daily_combined.nc'

forcing_files_har:
  - 'har_land_2m_temperature_2000-2000_daily_max_combined.nc'
  - 'har_land_2m_temperature_2000-2000_daily_min_combined.nc'
  - 'har_land_2m_temperature_2000-2000_daily_mean_combined.nc'
  - 'har_land_total_precipitation_2000-2000_daily_combined.nc'

# --- Calibration settings ---
calibration:
  metrics:
    primary: 'KGE'
    secondary: ['NSE', 'PBIAS', 'RMSE']
  iterations: 5000
  ngs: 15
